<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <title> Sign Up Page </title>
</head>


<body style="background-color: F1F5F9;">

   <div class="container mt-4">
   <h1 class="text-center mb-4">Sign Up Form</h1>

   <form id="signupForm" action="welcome.html" class="mx-auto" style="max-width: 550px;">
   <label class="d-block mb-3"> First Name:
      <input type="text" id="fName" name="fName" class="form-control">
   </label>

   <label class="d-block mb-3">Last Name:
      <input type="text" id="lName" name="lName" class="form-control">
   </label>
 
   Gender:
   <label><input type="radio" name="gender" value="m"> Male</label>
   <label><input type="radio" name="gender" value="f"> Female</label>

   <label class="d-block mb-3">Zip Code:
      <input type="text" id="zip" name="zip" class="form-control">
      <span id="zipError" class="text-danger"></span>
   </label>

   <div class="mb-3">
      <div>City: <span id="city"></span></div>
      <div>Latitude: <span id="latitude"></span></div>
      <div>Longitude: <span id="longitude"></span></div>
   </div>

   <label class="d-block mb-3">State:
   <select id="state" name="state" class="form-select">
      <option value="">Loading states...</option>
   </select>
   </label>

   <label class="d-block mb-3">Select a County:
      <select id="county" name="county" class="form-select"></select>
   </label>

   <label class="d-block mb-3">Desired Username:
      <input type="text" id="username" name="username" class="form-control">
   </label>
   <span id="usernameError"></span>

   <label class="d-block mb-3">Password:
         <input type="password" id="password" name="password" class="form-control">
   </label>
   <span id="suggestedPassword"></span>

   <label class="d-block mb-3">Type Password Again:
      <input type="password" 
         id="passwordAgain" 
         name="passwordAgain" 
         class="form-control">
   </label>

   <div id="passwordError" class="text-danger"></div>

   <button class="btn btn-primary mt-3">Sign up!</button>
   </form>

   <!-- Footer -->
   <footer class="text-center mt-5 mb-4">
      <p>&copy; 2026 Anthony Ou. All rights reserved.</p>
      <p>This site is for academic purposes only.</p>
      <p>CST 336 Internet Programming.</p>
      <img src="img/csumb_logo.jpg"
         alt="CSUMB logo"
         class="footer-logo"
         width="120">
   </footer>

   </div> <!-- End Bootstrap container -->

   <script src="js/script.js"></script>
</body>

</html>
